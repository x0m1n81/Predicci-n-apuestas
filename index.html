<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1020"><link rel="manifest" href="manifest.json"><title>Picks filtrados</title><style>:root{--bg:#071022;--card:#151d33;--border:#2b3b60;--text:#f2f5ff;--muted:#aab4cc;--blue:#5b8df6;--good:#54d6a7;--bad:#ff7777}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#071022,#091426);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:28px 20px 60px}.hero,.empty,.pick{background:var(--card);border:1px solid var(--border);border-radius:24px}.hero{padding:28px 24px}.hero h1{font-size:34px;margin:0 0 12px}.hero p{font-size:18px;line-height:1.45;color:var(--muted);margin:0}.buttons{display:flex;gap:14px;margin:30px 0 26px}.btn{border:1px solid #385183;background:var(--blue);color:white;border-radius:20px;padding:17px 20px;font-size:18px;font-weight:700;flex:1}.btn.secondary{background:#5b8df6}.status{font-size:18px;color:var(--muted);margin:12px 4px}.empty{padding:38px 24px;text-align:center;margin-top:18px}.empty h2{font-size:25px;margin:0 0 20px}.empty p{font-size:20px;line-height:1.45;color:var(--muted);margin:0}.pick{padding:18px;margin:12px 0}.picktop{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}.match{font-size:19px;font-weight:750;margin:10px 0}.selection{font-size:22px;font-weight:800}.meta{color:var(--muted);margin-top:8px}.score{display:inline-block;background:#223253;border-radius:999px;padding:5px 10px;color:#dce6ff;font-weight:700}.note{margin-top:30px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}@media(max-width:600px){.hero h1{font-size:30px}.buttons{gap:10px}.btn{font-size:16px;padding:16px 10px}.hero p{font-size:17px}}</style></head><body><main class="wrap"><section class="hero"><h1>🎯 Picks filtrados</h1><p>Blogabet + historial de tipsters + consenso. Solo mostramos señales que superan el filtro.</p></section><div class="buttons"><button class="btn" id="refresh">🔄 Actualizar Blogabet</button><button class="btn secondary" id="import">Importar JSON</button><input id="file" type="file" accept="application/json" hidden></div><div class="status" id="status">Fuente: <b>cargando…</b><br><br><span id="counts">0 picks analizados · 0 picks filtrados</span></div><section id="content"></section><p class="note">El filtro es probabilístico y no garantiza resultados. No se muestran picks solo por tener una cuota alta.</p></main><script src="app.js"></script></body></html>
