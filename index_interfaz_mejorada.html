<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<link rel="manifest" href="manifest.json">
<title>Blogabet Picks V6</title>
<style>
:root{
  --bg:#060b16;--bg2:#0b1324;--card:#111a2d;--card2:#16213a;
  --border:#263657;--text:#f7f9ff;--muted:#9eabc5;
  --blue:#5b8df6;--blue2:#7aa5ff;--good:#42d3a4;--gold:#f5c451;
  --danger:#ff6b7a;--shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);
  background:
    radial-gradient(circle at 15% -5%,rgba(91,141,246,.20),transparent 34%),
    radial-gradient(circle at 90% 10%,rgba(66,211,164,.10),transparent 28%),
    linear-gradient(145deg,var(--bg),var(--bg2));
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
.wrap{max-width:960px;margin:auto;padding:18px 14px 48px}
.hero{
  position:relative;overflow:hidden;padding:25px 22px;
  border:1px solid var(--border);border-radius:28px;
  background:linear-gradient(145deg,rgba(22,33,58,.96),rgba(13,21,39,.96));
  box-shadow:var(--shadow);
}
.hero:after{
  content:"";position:absolute;width:170px;height:170px;border-radius:50%;
  right:-65px;top:-75px;background:rgba(91,141,246,.14);filter:blur(2px)
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.logo{
  width:48px;height:48px;display:grid;place-items:center;border-radius:15px;
  background:linear-gradient(135deg,var(--blue),#385fc1);
  font-size:25px;box-shadow:0 10px 25px rgba(91,141,246,.25)
}
.hero h1{font-size:28px;line-height:1.1;margin:0;font-weight:850;letter-spacing:-.5px}
.hero p{color:var(--muted);line-height:1.5;margin:10px 0 0;max-width:760px;font-size:14px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:14px 0}
.btn{
  border:1px solid rgba(255,255,255,.08);background:linear-gradient(135deg,var(--blue2),var(--blue));
  color:white;border-radius:17px;padding:14px 16px;font-size:15px;font-weight:800;
  box-shadow:0 9px 25px rgba(55,100,205,.18);cursor:pointer;
}
.btn.alt{background:var(--card2);box-shadow:none}
.btn:active{transform:translateY(1px)}
.status{
  display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;
  margin:13px 4px 8px
}
.status:before{
  content:"";width:7px;height:7px;border-radius:50%;background:var(--good);
  box-shadow:0 0 10px rgba(66,211,164,.7)
}
#content{display:block}
.pick{
  position:relative;overflow:hidden;padding:18px;margin:11px 0;
  border:1px solid var(--border);border-radius:22px;
  background:linear-gradient(145deg,rgba(17,26,45,.98),rgba(13,21,37,.98));
  box-shadow:0 10px 30px rgba(0,0,0,.16);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease
}
.pick:hover{transform:translateY(-2px);border-color:#38527f;box-shadow:0 15px 35px rgba(0,0,0,.22)}
.pick:first-child{border-color:rgba(91,141,246,.55);box-shadow:0 12px 35px rgba(47,84,170,.18)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.35px}
.score{
  background:linear-gradient(135deg,#314a7b,#26385f);border:1px solid #415b8e;
  border-radius:999px;padding:6px 10px;color:#fff;font-weight:850;font-size:12px
}
.match{font-size:18px;font-weight:850;margin:12px 0 7px;line-height:1.25}
.selection{
  display:inline-block;font-size:20px;font-weight:900;line-height:1.2;
  color:#fff;background:rgba(91,141,246,.10);border:1px solid rgba(91,141,246,.22);
  border-radius:13px;padding:9px 12px;margin:3px 0
}
.meta{color:var(--muted);font-size:12px;margin-top:9px;line-height:1.45}
.empty,.panel{
  padding:23px;margin-top:15px;border:1px solid var(--border);
  border-radius:22px;background:var(--card);box-shadow:var(--shadow)
}
.empty{text-align:center}
.note{color:#7785a2;font-size:12px;line-height:1.5;text-align:center;margin:20px auto 0;max-width:720px}
@media(max-width:600px){
  .wrap{padding:12px 11px 38px}
  .hero{padding:21px 17px;border-radius:24px}
  .hero h1{font-size:24px}
  .logo{width:43px;height:43px;font-size:22px}
  .buttons{grid-template-columns:1fr}
  .btn{padding:14px}
  .pick{padding:16px;border-radius:19px}
  .match{font-size:17px}
  .selection{font-size:18px}
}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<div class="brand"><div class="logo">🎯</div><h1>Blogabet Picks V6</h1></div>
<p>Filtra picks reales de Blogabet usando rendimiento histórico, yield, winrate, cuota y consenso. No se generan apuestas ficticias.</p>
</section>
<div class="buttons">
<button class="btn" id="refresh">🔄 Actualizar datos</button>
<button class="btn alt" id="import">📥 Importar JSON</button>
<input id="file" type="file" accept="application/json" hidden>
</div>
<div class="status" id="status">Cargando…</div>
<section id="content"></section>
<p class="note">El marcador es un filtro estadístico, no una garantía de beneficio. Las apuestas deportivas implican riesgo.</p>
</main>
<script src="app_3_corregido.js"></script>
</body>
</html>
