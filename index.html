<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<link rel="manifest" href="manifest.json">
<title>TOP PICKS MULTIFUENTE</title>
<style>
:root{--bg:#071022;--card:#151d33;--border:#2b3b60;--text:#f2f5ff;--muted:#aab4cc;--blue:#5b8df6}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#071022,#091426);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:auto;padding:22px 16px 60px}.hero,.card,.empty{background:var(--card);border:1px solid var(--border);border-radius:18px}
.hero{padding:22px}.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0;color:var(--muted);line-height:1.45}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:16px 0}
select,button{min-height:46px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);padding:0 12px;font-size:14px}
button{background:var(--blue);border-color:var(--blue);font-weight:700}.status{color:var(--muted);font-size:13px;margin:10px 3px}
.card{padding:15px;margin:9px 0}.topCard{border-width:2px}.meta{color:var(--muted);font-size:12px}.match{font-size:17px;font-weight:800;margin:8px 0}.pick{font-size:18px;font-weight:800;background:#202a40;padding:10px;border-radius:11px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:8px 0}.empty{padding:18px;color:var(--muted);margin:10px 0}
h2{font-size:19px;margin:20px 0 10px}footer{color:var(--muted);font-size:12px;text-align:center;line-height:1.5;margin-top:20px}
@media(max-width:600px){.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<h1>🏆 TOP PICKS MULTIFUENTE</h1>
<p>Ranking conservador por calidad de señal. El TOP 5 solo muestra picks activos y nunca repite el mismo partido.</p>
</section>
<section class="controls">
<select id="source"><option value="all">Todas las fuentes</option></select>
<select id="sport">
<option value="all">Todos los deportes</option>
<option value="football">⚽ Fútbol</option>
<option value="basketball">🏀 Baloncesto</option>
<option value="tennis">🎾 Tenis</option>
<option value="baseball">⚾ Béisbol / MLB</option>
<option value="hockey">🏒 Hockey / NHL</option>
<option value="boxing">🥊 Boxeo</option>
<option value="mma">🥋 MMA / UFC</option>
<option value="american_football">🏈 Fútbol americano</option>
<option value="motorsport">🏎️ Motor</option>
<option value="rugby">🏉 Rugby</option>
<option value="handball">🤾 Balonmano</option>
<option value="other">🏅 Otros</option>
</select>
<button id="refresh">🔄 Actualizar</button>
</section>
<div class="status" id="status">Cargando datos…</div>
<section id="top"></section>
<section id="list"></section>
<footer>La puntuación es un filtro interno; no es una probabilidad de acierto ni una garantía de beneficio.</footer>
</main>
<script src="app_3_corregido.js"></script>
</body>
</html>
